{% extends 'base.html' %}

{% block title %}
Login | Biznews
{% endblock title %}

{% block css %}

{% endblock css %}

{% block content %}
<!-- Login Form Start -->
    <div class="container-fluid mt-5 pt-3">
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <div class="bg-white border border-top-0 p-4 mb-3">
                        
                        <h6 class="text-uppercase font-weight-bold mb-3">User Login</h6>
                        <form method="POST" action="{% url 'login' %}">

                            {% csrf_token %}

                            <div class="form-group">
                                <input type="text" class="form-control" placeholder="Username or Email" name="username"></input>
                            </div>

                            <div class="form-group">
                                <input type="password" class="form-control" placeholder="Password" name="password">
                            </div>

                            <div>
                                <p class="text-danger"><a href="{% url 'signup' %}">Don't have an account?</a></p>
                            </div>

                            <div>
                                <button class="btn btn-primary font-weight-semi-bold px-4" style="height: 50px;"
                                    type="submit">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Login Form End -->
{% endblock content %}
